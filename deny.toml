# Dependency policy enforced by `cargo deny check` and the pre-push hooks in
# devenv.nix. Reviewed 2026-09-19 against the full Cargo.lock license
# inventory: every allowed license below appears in the current graph, and
# every graph license is allowed — except OR-expression alternatives a
# crate never resolves to (e.g. `adler2`'s unused `0BSD` arm, satisfied
# via MIT/Apache-2.0). Re-review this list when adding a dependency
# under a license not already here — especially copyleft ones.
#
# License notes from that inventory:
# - `self_cell` and `r-efi` carry OR expressions with GPL-2.0-only /
#   LGPL-2.1-or-later alternatives, but each also offers Apache-2.0 or MIT, so
#   they check out under the permissive choice. No crate is GPL-only.
# - `attohttpc` (via `igd-next`) is the single MPL-2.0-only crate. MPL-2.0 is
#   file-level copyleft with no repo-wide effect; allowed deliberately.

[advisories]
# Vulnerabilities always fail and cannot be downgraded. Soundness
# advisories fail too: this workspace holds drive keys, so an `unsound`
# crate anywhere in the graph blocks rather than warns. (Precedent:
# RUSTSEC-2026-0306 in faster-hex <= 0.10.0, via pinned nostr 0.45;
# resolved by the 0.10.1 bump — no exception needed. Reachability
# finding lives on the `nostr` dependency comment in Cargo.toml.)
# Yanked crates only warn. Unmaintained crates fail only when they are
# direct workspace dependencies: the three unmaintained advisories in
# the graph today (atomic-polyfill, paste, proc-macro-error) are
# transitive-only, so they are reported but do not block. Promote to
# `all` once those are eliminated.
yanked = "warn"
unmaintained = "workspace"
unsound = "all"
# Stale ignores fail the gate instead of lingering silently: when a
# bump or a withdrawal clears an advisory below, `cargo deny check`
# errors on the now-unused entry until it is deleted. This is the
# automatic half of the RUSTSEC revisit process (decided 2026-11-22);
# the dated half lives in each entry's reason.
unused-ignored-advisory = "deny"
# Scoped advisory ignores. Each entry carries its own reason: why the
# advisory cannot reach this workspace, what change removes the
# entry, and when to re-check. Nothing here downgrades a reachable
# risk.
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "Unreachable: gtk-rs 0.18 VariantStrIter is Linux GUI-variant iteration, absent from the desktop command surface. Remove when Tauri moves to gtk >=0.20 (patched there) or the entry goes unused. Re-check 2027-05-22." },
  # RUSTSEC-2026-0574…0582 (heapless 0.7/0.8 unsound batch, issued
  # 2026-11-18/19, nine advisories, one crate). Two paths, neither
  # reachable: heapless 0.8.0 via faster-hex is compiled out
  # (faster-hex enables `alloc`, and its heapless dep is
  # `cfg(not(feature = "alloc"))` — lockfile-only), and postcard
  # 1.1.3's compiled heapless use stays on the `Vec`/`String`
  # surface (the `HVec` flavor over `Vec<u8>` plus `MaxSize`
  # impls) without reaching any advisory-listed API; its
  # `IndexMap` use is under `#[cfg(test)]`.
  # Shared removal trigger for all nine: delete the entry when the
  # iroh/nostr trees resolve heapless to >=0.9.4 (patched there), if
  # postcard's heapless use widens beyond `Vec`, or when the entry
  # goes unused. Shared re-check: 2027-02-22.
  { id = "RUSTSEC-2026-0574", reason = "Unreachable: SortedLinkedList::FindMutView::pop UAF; SortedLinkedList unused by postcard/faster-hex. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
  { id = "RUSTSEC-2026-0575", reason = "Unreachable: spsc::Spsc::peek ordering race; the spsc channel unused by postcard/faster-hex. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
  { id = "RUSTSEC-2026-0576", reason = "Unreachable: IndexMap::truncate corrupt state; postcard IndexMap use is #[cfg(test)] only. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
  { id = "RUSTSEC-2026-0577", reason = "Untriggerable: batch includes vec::IntoIter::drop, but postcard uses heapless::Vec only as a Vec<u8> buffer and u8 cannot panic-drop; IndexMap/Deque/HistoryBuf parts unused or test-only. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
  { id = "RUSTSEC-2026-0578", reason = "Unreachable: SortedLinkedList::zeroize broken invariant; SortedLinkedList unused by postcard/faster-hex. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
  { id = "RUSTSEC-2026-0579", reason = "Unaffected: Deque::try_from bug range >=0.9.2,<0.9.4 excludes our 0.7.17/0.8.0, and Deque unused regardless. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
  { id = "RUSTSEC-2026-0580", reason = "Unreachable: pool Treiber-stack race; pool/object_pool/box_pool/arc_pool modules unused by postcard/faster-hex. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
  { id = "RUSTSEC-2026-0581", reason = "Unreachable: Deque::make_contiguous OOB write; Deque unused by postcard/faster-hex. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
  { id = "RUSTSEC-2026-0582", reason = "Unreachable: IndexMap::insert needs a u16::MAX-element map; module test-only and trigger unfillable. Remove when iroh/nostr reach heapless >=0.9.4 or the entry goes unused. Re-check 2027-02-22." },
]

[licenses]
allow = [
  "Apache-2.0",
  # Apache-2.0 with the LLVM patent-grant exception (OSI-approved,
  # strictly more permissive than Apache-2.0, no copyleft): enters
  # with the Tauri tree via `target-lexicon`. Re-reviewed 2026-11-10
  # per the header rule for licenses not already here.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Duplicate crate versions only warn: ~30 crates currently carry two
# versions each (crypto, rand, windows-targets families among them;
# getrandom and rand_core carry three), not just the r-efi 5.3/6.0 pair
# this note once named. Promote to deny once the graph converges.
multiple-versions = "warn"

[sources]
# crates.io is the only permitted registry; the lockfile currently contains
# no git sources. Unknown registries fail, unknown git sources fail.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
