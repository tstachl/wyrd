[package]
name = "wyrd-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wyrd's per-user application settings file schema: version, per-drive sections, and strict validation. Serialization and rules only — no filesystem access, no locking, no path resolution, no runtime application. The daemon remains the runtime consumer; the desktop is the second consumer of the same contract."

[dependencies]
serde.workspace = true
# Version dispatch and the v1→v2 migration are schema rules. Both
# readers call `parse_settings` so neither can migrate differently;
# the consumers still own file I/O, locking and atomic writes.
serde_json.workspace = true

[dev-dependencies]

[lints]
workspace = true
