[package]
name = "wyrd-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The desktop management UI backend: a non-owning Tauri client of the drive-owner interface. Forwards operations through the shared OwnerClient and never opens a drive directory — the owner holds the store, the shell only forwards."

[dependencies]
wyrd-owner-client.workspace = true
# Typed IPC answers and refusal codes; no other serialization surface.
serde.workspace = true
serde_json.workspace = true
# Backend error plumbing only.
thiserror.workspace = true
# Desktop runtime: application toolkit for the command surface below.
# Reserved for this crate by the layer gate (`tauri` edge).
tauri.workspace = true
# Native file pickers for credential and invitation paths (first
# shipped view needing it: runtime provisioning). Secrets never
# cross the picked paths — only path strings travel to the CLI
# adapter. Reserved alongside `tauri` by the layer gate.
tauri-plugin-dialog.workspace = true

[build-dependencies]
# Embeds `tauri.conf.json` plus `capabilities/` at compile time for
# the application context. A build-dependency, not a production edge:
# the dependency-DAG checker counts `[dependencies]` tables only.
tauri-build.workspace = true

[dev-dependencies]
# `test` unlocks `tauri::test` (mock runtime, `get_ipc_response`)
# for the command-layer proofs in `tests/`: the mock stands in for
# the transport only, against the same real owner. Production builds
# never carry these edges (the closure test pins that) — and the
# layer gate does not count `dev-dependencies` at all.
tauri = { workspace = true, features = ["test"] }
# Integration tests spin a real owner (the daemon's server over a
# composed view) and drive it through the backend: the IPC proofs
# run against live interface answers, never against invented
# semantics. Production builds never carry these edges (the closure
# test pins that).
wyrd-core = { workspace = true, features = ["test-fixtures"] }
wyrd-daemon = { workspace = true }
wyrd-format = { workspace = true }
wyrd-sync = { workspace = true, features = ["insecure-fast-kdf"] }

[lints]
workspace = true
