[package]
name = "wyrd-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wyrd's daemon library: composes the sync engine with the drive view and presentation backends (FUSE today, platform file surfaces later). The wyrd binary lives in wyrd-cli."

[dependencies]
wyrd-format.workspace = true
wyrd-sync.workspace = true
wyrd-view.workspace = true
wyrd-core.workspace = true
# The owned drive-owner protocol types and non-owning client: the
# single definition of the wire both sides agree on. The daemon keeps
# the server and performs every domain-to-wire conversion in
# `owner::mapping`; it never redefines the protocol.
wyrd-owner-client.workspace = true
# The FUSE adapter is the first presentation backend, not a property of
# the node (`docs/architecture.md`): it is a default-on feature so a
# machine without system libfuse can still build and run everything
# above the mount. Gating the dependency is not enough on its own —
# `pub mod fuse` below is gated on the same feature, so no mount-only
# name leaks into a mount-free build.
fuser = { version = "0.18", optional = true }
# Fresh per-process instance ids for the posture sidecar: without an
# instance id there is no honest posture to publish.
getrandom.workspace = true
# Hex-encoded instance and serving ids in the sidecar: identities,
# never trust.
hex.workspace = true
libc.workspace = true
thiserror.workspace = true
# The posture sidecar (22c) is process posture for every composer, not
# CLI diagnostics: schema-versioned JSON beside the drive, so both the
# writer (vault, host) and lock-refused readers live here. `serde` is
# the schema, `serde_json` the atomic file encoding — parse-only on
# read, fixed-schema on write.
serde.workspace = true
serde_json.workspace = true
# Structured mount events the process host bridges into its diagnostics.
tracing.workspace = true

[features]
default = ["mount"]
# The live FUSE mount: `FuseBackend`, its `fuser::Filesystem` impl,
# and the mount/session setup. Everything else in this crate — the
# node composition, supervision, and vault operation — builds and
# runs without it.
# Deliberately one feature, not a mount/presentation pair: a
# mount-free errno vocabulary would need a second POSIX-error
# mapping, and the contract suite's errno assertions stay with the
# mount by design (see the `08` issue's OD-08-A/B).
mount = ["dep:fuser"]

[dev-dependencies]
# Downstream tests build a real `Engine` per test; enabling the fast KDF
# profile here keeps that affordable without touching production builds.
wyrd-sync = { workspace = true, features = ["insecure-fast-kdf"] }
# Fixture authoring (`WyrdNode::put_file`/`remove`) is test-only (see
# `layer_contracts`); production builds never carry it.
wyrd-core = { workspace = true, features = ["test-fixtures"] }
# Refusal-emission tests capture the backend's trace lines around the
# refusing call; production logging stays on `tracing` alone.
tracing-subscriber = "0.3"
# Withdrawal tests seal under a real route (fake bytes decode to no
# route and would record the withdrawal sentinel on first discharge,
# completing vacuously). Pinned to the workspace set, like every
# other iroh edge.
iroh.workspace = true

[lints]
workspace = true
