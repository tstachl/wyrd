# gate: agent-facing development CLI. Verbs encode the correct procedure.
# Profile for this repo: gate reads this from the checkout root.

[project]
# ngit repository coordinate, passed to every ngit call as --repo.
repo_naddr = "naddr1qqz8w7tjvspzpv7ftn3nm75yxfnpr69h48qsk7xl9p65cw93q6jtcqvkhxl97nj2qvzqqqrhnyzuuxrw"
# Branch prefix that marks a proposal branch.
branch_prefix = "pr/"
# Signer whose comments count as review (resolved to an npub at runtime).
review_signer = "scout"
# Draft a newly created proposal as part of the first push, matching the
# "draft immediately after the first push" policy (CI runs on
# ready_for_review only). This replaces the old CI auto-draft job (removed
# from .ngit/act/workflows/): new PRs land open, and the project works
# draft-first. Omit for the default (proposal stays open).
auto_draft = true

[ci]
# Trust floor passed to `ngit ci status --require-ci-trust`.
trust_level = "maintainer-directed"

[log]
# Per-user invocation log, outside the repo by design.
path = "~/.local/state/gate/invocations.jsonl"

# Triage taxonomy, mirroring CONTRIBUTING.md: every triaged issue carries
# exactly one label from each category. `gate issue label` validates
# against these and swaps any existing label in the same category, so
# milestones never stack. Unlisted `release:*` values are still accepted
# (and swapped) by prefix; extend the milestone list as the roadmap firms
# up. Omit the table to allow only a bare `gate issue create`.
[issues]
types = ["bug", "enhancement", "chore"]
priorities = ["P0", "P1", "P2", "P3", "P4"]
milestones = [
  "release:v0.1.0-alpha",
  "release:v0.2.0-alpha",
  "release:v0.3.0-alpha",
  "release:v0.4",
  "release:v0.5",
  "release:v0.6",
  "release:v0.7",
  "release:v0.8",
  "release:v0.9.0-beta",
  "release:v1.0",
  "release:backlog",
]

# How `gate review run` fires the reviewer: the repo's branch-review
# prompt and the model it runs. The command template defaults to an
# `opencode run` invocation; substituted values are shell-quoted by gate.
# `{variant}` expands to `--variant X` (or nothing when unset), `{pr}`,
# `{tip}` and `{log}` name the proposal, its tip and this run's log.
# Prompts are vendored in the checkout (master and pr/* worktrees carry
# their own copy), so the path is checkout-relative.
[review]
prompt = ".agents/prompts/branch-review-wyrd.md"
model = "opencode-go/muse-spark-1.3-contributor"
variant = "xhigh"

# Odin runner resource: the forced-command ssh path. The machine id comes
# from the key entry server-side; nothing here can forge it.
[runner]
host = "odin"
user = "gate-runner"
key = "~/.ssh/id_ed25519_gate_odin"
# The host's name for this repository. The client names a repository and
# a revision, never a path: the host resolves the name to the source it
# is willing to build, so the name is profile configuration.
repo = "wyrd"

# The wyrd-gate-e2e task declaration: data only. The gate runner reads
# this section from the staged revision (never host config): entryPoint
# runs as the build user under the host caps, requires must resolve in
# the runner tool closure, builds map names to flake attrpaths the host
# builds sandboxed, and relayRole names the manifest role the suite
# waits on. Nothing here executes on the host except through the
# provisioned Incus images; guest code is data.
[tasks.wyrd-gate-e2e]
entryPoint = "tests/gate/gate-entry.sh"
requires = ["bats", "tar", "diff", "gawk", "gzip", "jq"]
relayRole = "relay"

[tasks.wyrd-gate-e2e.builds]
img-peer-o = "images.peer-o"
img-peer-n = "images.peer-n"
img-relay = "images.relay"
# The drive-service evidence task: one provisioned microVM guest
# declaring a vault and a mount through services.wyrd.drives. Data
# only, same contract as the e2e task: the gate runner reads this
# section from the staged revision, checks the box against the host
# caps, provisions exactly it, builds the runner sandboxed, boots,
# waits, and runs the entryPoint as the build user. No relay box and
# no relayRole: supervision, not convergence, is under test. requires
# names only what the entry execs beyond the ambient base (bash, ssh,
# flock, coreutils ride with the runner like the e2e entry relies on
# unlisted): bats runs the suite file.
[tasks.wyrd-drive-e2e]
entryPoint = "tests/drive/drive-service-entry.sh"
requires = ["bats"]

[tasks.wyrd-drive-e2e.builds]
runner-drive = "nixosConfigurations.wyrd-drive-vm.config.microvm.runner.qemu"

# Declared VM topology for the drive-service task: data only, same
# shape contract as the e2e task (pinned by
# tests/harness/test-topology-toml.sh). One box on tap-d, the next
# free slot after the e2e trio. mem_mb is 2049, not 2048: QEMU hangs
# exactly-2GiB microvm guests in ACPI init (initrd/ACPI overlap,
# microvm-nix/microvm.nix#171); mirrors nix/microvm/drive.nix.
[tasks.wyrd-drive-e2e.topology]
version = 1
boxes = ["drive"]
[tasks.wyrd-drive-e2e.topology.box.drive]
vcpu = 2
mem_mb = 2049
tap = "tap-d"
mac = "02:00:00:00:07:13"
ip = "10.0.7.13/24"
ssh = true
