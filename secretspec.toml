[project]
name = "wyrd"
revision = "1.0"
# devenv resolves these at shell-entry time, including for non-interactive
# agents and CI. Requiring a per-access reason would make `devenv shell`
# fail before the environment exists, so the repository opts out here.
require_reason = false

# macOS developer-signing inputs. Values live in the developer's keyring,
# never in the repository. All five are declared so every signing mode and
# team identity can be driven from the environment; the profile-backed pair
# is optional because the team-prefixed App Group also supports a
# profile-free build.
[profiles.default]
APPLE_IDENTITY = { description = "Apple Development identity used to sign the macOS bundle", required = true }
APPLE_TEAM_ID = { description = "Ten-character Apple Team ID; derives the App Group id for a third-party build", required = false }
APPLE_SIGN_APEX = { description = "Set to 1 to sign the File Provider extension with APPLE_IDENTITY", required = false }
APPLE_PROVISIONING_PROFILE = { description = "Path to the File Provider provisioning profile (profile-backed mode)", required = false }
APPLE_APP_PROVISIONING_PROFILE = { description = "Path to the containing app provisioning profile (profile-backed mode)", required = false }
