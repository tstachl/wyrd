# Native static-site workflow (port of the former
# .ngit/act/workflows/page.yml).
#
# Static site for https://wyrd.enesis.md/ from `page/` (self-contained
# index.html + fonts + svg, no build step): one job checks that
# marketing claims stay pinned to docs (page/check.ts fails on drift or
# present-tense overclaims), then deploys via wrangler to the
# wyrd-enesis-md Pages project.
#
# Master pushes only, scoped to page/** so Rust changes never trigger
# it. PR jobs cannot request secrets even for maintainer PRs, so there
# is no PR preview leg: PRs touching page/** get the local
# `bun run page/check.ts` plus the doc-links hook, and the deploy runs
# once the push lands on master.
version: 1
system: x86_64-linux
name: page
reuse: never

on:
  push:
    branches: [master]
    paths:
      - "page/**"
      - ".ngit/nix/workflows/page.yaml"

jobs:
  deploy:
    secrets: [CLOUDFLARE_ACCOUNT, CLOUDFLARE_API_TOKEN]
    steps:
      - check:
          run: page.check
      - deploy:
          run: page.deploy
