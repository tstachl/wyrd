# Native rust gates (phase 2 of the act → Nix port).
# Two steps jobs sharing one store each: every job gets a fresh Incus
# VM with a cold /nix/store, and crane sharing (cargoArtifacts =
# rustDeps) only helps on a binary-cache hit — with no cache served,
# per-gate build jobs each rebuilt rust-deps independently. Steps in
# one job share the same VM and store, so deps builds once per job
# (twice total) instead of four-plus times. Two jobs, not one: a
# single serial run exceeds the 30-minute allocation. needs: between
# build jobs is forbidden and shares no Nix state; only steps share.
# Mirrors the act rust job step for step — check (+ the production
# feature-graph gate), clippy, nextest default profile, audit+deny —
# so a native green means the same thing as an act green. Doctests
# moved to rust-slow.yaml in Nov-09: 2 listed doctests do not justify a
# second workspace compile on every PR (see
# docs/design/test-review.md). Only the audit step reaches the
# network (advisory DB), and only for the DB. No artifacts (no
# provider Blossom yet), no secrets, no Docker.
version: 1
system: x86_64-linux
name: rust

# Resource floors the provider can actually match: the Incus
# adapter advertises vcpus, memory-mib and (when diskGiB is set)
# disk-mib — there is no scratch-mib key, and the coordinator
# matches keys exactly with no fallback, so demanding scratch-mib
# vetoes scheduling outright (jobs sit until the search deadline).
# Disk is enforced where it belongs, at the adapter via diskGiB;
# memory-mib is the binding floor the host already provides.
requirements:
  resources:
    memory-mib: {gte: 4096}

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/**"
      - ".ngit/nix/**"
  pull_request:
    # Ready-gated like the act job: draft pushes spend no CI, the
    # draft-to-ready transition mints the runs.
    types: [ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/**"
      - ".ngit/nix/**"

jobs:
  # Fast gates: deps once, then check + clippy reuse it in the same
  # store, then the audit run command (network for the advisory DB).
  # Build steps lead; the run step closes — no run before build.
  gates-fast:
    steps:
      - deps:
          build: checks.x86_64-linux.rust-deps
      - check:
          build: checks.x86_64-linux.rust-check
      - clippy:
          build: checks.x86_64-linux.rust-clippy
      - audit:
          run: rust.audit
  # Test gate: deps once, then the test suite reuses it in the
  # same store. Higher memory floor for nextest parallelism; no
  # scratch-mib (unschedulable — the adapter never advertises it).
  # (Named gates-tests, not gates-slow: it runs the default profile
  # on every PR. The slow profile and the doctests live in
  # rust-slow.yaml and run on master pushes only.)
  gates-tests:
    requirements:
      resources:
        memory-mib: {gte: 8192}
    steps:
      - deps:
          build: checks.x86_64-linux.rust-deps
      - tests:
          build: checks.x86_64-linux.rust-tests
