# Native rust gates (phase 2 of the act → Nix port).
# Mirrors the act rust job step for step — check (+ the production
# feature-graph gate), clippy, nextest default profile, doctests,
# audit+deny — so a native green means the same thing as an act
# green. Dependencies resolve offline from the vendored lockfile;
# only the audit job reaches the network (advisory DB), and only for
# the DB. No requirements beyond coordinator defaults, no artifacts
# (no provider Blossom yet), no secrets, no Docker.
version: 1
system: x86_64-linux
name: rust

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/**"
      - ".ngit/nix/**"
  pull_request:
    # Ready-gated like the act job: draft pushes spend no CI, the
    # draft-to-ready transition mints the runs.
    types: [ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/**"
      - ".ngit/nix/**"

jobs:
  check:
    run: rust.check
  clippy:
    run: rust.clippy
  tests:
    run: rust.tests
  doctests:
    run: rust.doctests
  audit:
    run: rust.audit
