# Native rust gates (phase 2 of the act → Nix port).
# Compile-once shape: the deps job compiles third-party and
# dev-dependencies a single time per Cargo.lock (published to the
# managed cache); each gate compiles only workspace crates against
# those artifacts. Mirrors the act rust job step for step — check (+
# the production feature-graph gate), clippy, nextest default
# profile, doctests, audit+deny — so a native green means the same
# thing as an act green. Only the audit job reaches the network
# (advisory DB), and only for the DB. No requirements beyond
# coordinator defaults, no artifacts (no provider Blossom yet), no
# secrets, no Docker.
version: 1
system: x86_64-linux
name: rust

# Resource floors the provider can actually match: the Incus
# adapter advertises vcpus, memory-mib and (when diskGiB is set)
# disk-mib — there is no scratch-mib key, and the coordinator
# matches keys exactly with no fallback, so demanding scratch-mib
# vetoes scheduling outright (jobs sit until the search deadline).
# Disk is enforced where it belongs, at the adapter via diskGiB;
# memory-mib is the binding floor the host already provides.
requirements:
  resources:
    memory-mib: {gte: 4096}

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/**"
      - ".ngit/nix/**"
  pull_request:
    # Ready-gated like the act job: draft pushes spend no CI, the
    # draft-to-ready transition mints the runs.
    types: [ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/**"
      - ".ngit/nix/**"

jobs:
  deps:
    build: checks.x86_64-linux.rust-deps
  check:
    build: checks.x86_64-linux.rust-check
  clippy:
    build: checks.x86_64-linux.rust-clippy
  tests:
    build: checks.x86_64-linux.rust-tests
  doctests:
    build: checks.x86_64-linux.rust-doctests
  audit:
    run: rust.audit
