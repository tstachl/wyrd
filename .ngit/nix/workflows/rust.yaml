# Native rust gates (phase 2 of the act → Nix port).
# Three step jobs, each sharing one store: every job gets a fresh Incus
# VM with a cold /nix/store, and crane sharing (cargoArtifacts =
# rustDeps) only helps on a binary-cache hit — with no cache served,
# per-gate build jobs each rebuilt rust-deps independently. Steps in
# one job share the same VM and store, so deps builds once per job
# instead of once per step: three rust-deps builds per run, the cost
# of the separate windows. Separate jobs, not one serial run: a
# single run exceeds the 30-minute allocation. The test suite is two
# jobs, core and desktop, so each keeps its own timeout window. The
# core test derivation carries no Tauri GUI closure; its deps step
# still does. needs: between build jobs is forbidden and shares no
# Nix state; only steps share.
# Mirrors the act rust job step for step — check (+ the production
# feature-graph gate), clippy, nextest default profile, audit+deny —
# so a native green means the same thing as an act green. Doctests
# moved to rust-slow.yaml in Nov-09: 2 listed doctests do not justify a
# second workspace compile on every PR (see
# docs/design/test-review.md). The trust-boundary half of the doctest
# (the VerifiedSnapshot compile_fail pin) stays on this gate as the
# wyrd-contracts source-text test. Only the audit step reaches the
# network (advisory DB), and only for the DB. No artifacts (no
# provider Blossom yet), no secrets, no Docker.
version: 1
system: x86_64-linux
name: rust

# Resource floors the provider can actually match: the Incus
# adapter advertises vcpus, memory-mib and (when diskGiB is set)
# disk-mib — there is no scratch-mib key, and the coordinator
# matches keys exactly with no fallback, so demanding scratch-mib
# vetoes scheduling outright (jobs sit until the search deadline).
# Disk is enforced where it belongs, at the adapter via diskGiB;
# memory-mib is the binding floor the host already provides.
requirements:
  resources:
    memory-mib: {gte: 4096}

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/**"
      - ".ngit/nix/**"
  pull_request:
    # Ready-gated like the act job: draft pushes spend no CI, the
    # draft-to-ready transition mints the runs.
    types: [ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "tests/**"
      - ".ngit/nix/**"

jobs:
  # Fast gates: deps once, then check + clippy reuse it in the same
  # store, then the mount-free check + clippy lanes (the
  # `--no-default-features` build is a shipped configuration, so it
  # rides the fast gate instead of only the local hook), then the
  # rustdoc broken-link gate, then the audit run command (network
  # for the advisory DB).
  # Build steps lead; the run step closes — no run before build.
  gates-fast:
    steps:
      - deps:
          build: checks.x86_64-linux.rust-deps
      - check:
          build: checks.x86_64-linux.rust-check
      - clippy:
          build: checks.x86_64-linux.rust-clippy
      - check-nomount:
          build: checks.x86_64-linux.rust-check-nomount
      - clippy-nomount:
          build: checks.x86_64-linux.rust-clippy-nomount
      - doc:
          build: checks.x86_64-linux.rust-doc
      - audit:
          run: rust.audit
  # Core test gate: deps once, then the workspace suite without
  # wyrd-desktop reuses it in the same store. The desktop shell is a
  # leaf crate, so excluding it drops the GTK/WebKit closure from the
  # test derivation; the deps step still materialises it for the
  # desktop half. Two 30-minute windows replace one. Higher memory
  # floor for nextest parallelism; no scratch-mib (unschedulable — the
  # adapter never advertises it).
  gates-tests:
    requirements:
      resources:
        memory-mib: {gte: 8192}
    steps:
      - deps:
          build: checks.x86_64-linux.rust-deps
      - tests:
          build: checks.x86_64-linux.rust-tests
  # Desktop test gate: the wyrd-desktop tests the core gate excludes.
  # Carries the Tauri GUI closure in its own job and at the default
  # memory floor, so it schedules beside the core gate and cannot eat
  # the core gate's 30 minutes. The 3377.8 MiB peak is from the logged
  # aaa4d0b9 gates-tests run (guest RAM, including the guest OS); the
  # first ready-run must confirm the smaller desktop set fits 4096 MiB.
  gates-tests-desktop:
    steps:
      - deps:
          build: checks.x86_64-linux.rust-deps
      - tests:
          build: checks.x86_64-linux.rust-tests-desktop
